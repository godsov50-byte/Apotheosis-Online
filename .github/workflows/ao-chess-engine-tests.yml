name: AO Chess Engine Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'playtest/ao-tactical-chess/engine/**'
      - 'playtest/ao-tactical-chess/index.html'
      - 'playtest/ao-tactical-chess/tests/**'
      - 'playtest/ao-tactical-chess/encounter-director.mjs'
      - '.github/workflows/ao-chess-engine-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Encounter Director syntax
        run: node --check playtest/ao-tactical-chess/encounter-director.mjs
      - name: Run AO Chess engine regression tests
        run: node --test playtest/ao-tactical-chess/tests/*.test.mjs
