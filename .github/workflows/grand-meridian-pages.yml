name: Deploy Grand Meridian OAuth consent page

on:
  push:
    branches:
      - prototype/ao-chatgpt-oauth-consent
    paths:
      - "docs/**"
      - ".github/workflows/grand-meridian-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: grand-meridian-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out experimental consent-page branch
        uses: actions/checkout@v4
        with:
          ref: prototype/ao-chatgpt-oauth-consent

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the docs folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy experimental consent page
        id: deployment
        uses: actions/deploy-pages@v4
