name: AO Houston building footprint audit

on:
  push:
    branches:
      - feature/houston-building-footprint-audit
    paths:
      - "scripts/geography/acquire_houston_city_limits.py"
      - "scripts/geography/audit_houston_building_footprints.py"
      - ".github/workflows/houston-building-footprint-audit.yml"
  pull_request:
    branches:
      - feature/upper-gulf-coast-geography
    paths:
      - "scripts/geography/acquire_houston_city_limits.py"
      - "scripts/geography/audit_houston_building_footprints.py"
      - ".github/workflows/houston-building-footprint-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ao-houston-building-footprint-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependency
        run: python -m pip install --upgrade pip shapely
      - name: Test building audit
        run: python scripts/geography/audit_houston_building_footprints.py --self-test
      - name: Acquire official Houston city-limit polygons
        run: python scripts/geography/acquire_houston_city_limits.py --out build/houston-building-audit
      - name: Acquire and count intersecting building footprints
        run: python scripts/geography/audit_houston_building_footprints.py --city-limits build/houston-building-audit/houston-city-limits.geojson --out build/houston-building-audit
      - name: Upload source snapshot and audit report
        uses: actions/upload-artifact@v4
        with:
          name: ao-houston-building-footprint-audit-${{ github.sha }}
          path: |
            build/houston-building-audit/houston-city-limits.geojson
            build/houston-building-audit/acquisition-report.json
            build/houston-building-audit/building-footprint-audit.json
            build/houston-building-audit/source-layer-metadata.json
          if-no-files-found: error
          retention-days: 30
