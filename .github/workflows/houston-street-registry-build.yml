name: AO Houston street registry snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/houston-street-registry-build.yml"
      - "scripts/geography/acquire_houston_road_centerlines.py"
      - "scripts/geography/build_houston_street_registry.py"

permissions:
  contents: read

jobs:
  build-street-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test acquisition and registry compiler
        run: |
          python -m py_compile scripts/geography/acquire_houston_road_centerlines.py
          python -m py_compile scripts/geography/build_houston_street_registry.py
          python scripts/geography/build_houston_street_registry.py --self-test
      - name: Acquire complete Houston road-centerline snapshot
        run: python scripts/geography/acquire_houston_road_centerlines.py --output-dir build/houston-road-network --batch-size 500 --timeout 90 --pause 0.15
      - name: Compile deterministic street registry
        run: python scripts/geography/build_houston_street_registry.py --input build/houston-road-network/roads.geojson --source-manifest build/houston-road-network/manifest.json --output-dir build/houston-road-network
      - name: Upload source snapshot and registry
        uses: actions/upload-artifact@v4
        with:
          name: ao-houston-street-registry-${{ github.sha }}
          path: |
            build/houston-road-network/roads.geojson
            build/houston-road-network/manifest.json
            build/houston-road-network/street-registry.json
            build/houston-road-network/street-registry-manifest.json
          if-no-files-found: error
          retention-days: 30
