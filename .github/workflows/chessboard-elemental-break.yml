name: Chessboard elemental Break tests
on:
  pull_request:
    paths:
      - 'playtest/ao-tactical-chess/**'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'playtest/ao-tactical-chess/**'
jobs:
  elemental-break:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run elemental affinity and Break tests
        working-directory: playtest/ao-tactical-chess
        run: node tests/elemental-break.test.js
      - name: Check elemental engine syntax
        run: node --check playtest/ao-tactical-chess/engine/elemental-break.js
