name: AO Kernel mock contract tests

on:
  push:
    branches:
      - feature/kernel-ai-interface-foundation-v1
      - feature/kernel-replay-integrity-audit
    paths:
      - "kernel-mock/**"
      - "contracts/**"
      - ".github/workflows/kernel-mock-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run mock Kernel tests
        working-directory: kernel-mock
        run: npm test
