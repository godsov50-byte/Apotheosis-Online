name: AO Houston road-grid preview build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned projection runtime
        run: python -m pip install pyproj==3.7.2
      - name: Acquire complete City of Houston road-centerline snapshot
        run: python scripts/geography/acquire_houston_road_centerlines.py --output-dir build/houston-road-network --batch-size 500 --timeout 90 --pause 0.15
      - name: Compile source street registry and provenance report
        run: python scripts/geography/build_houston_street_registry.py --input build/houston-road-network/roads.geojson --source-manifest build/houston-road-network/manifest.json --output-dir build/houston-road-network
      - name: Convert road geometry to Houston-local millimetre preview
        run: python scripts/geography/build_houston_road_grid.py --preview-only --input build/houston-road-network/roads.geojson --source-manifest build/houston-road-network/manifest.json --output-dir build/houston-road-grid
      - name: Rasterize sparse AO centerline candidate cells
        run: node scripts/geography/rasterize_houston_road_grid.mjs --input build/houston-road-grid/roads-local-mm.json
      - name: Upload reproducible preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ao-houston-road-grid-preview-${{ github.sha }}
          path: |
            build/houston-road-network/roads.geojson
            build/houston-road-network/manifest.json
            build/houston-road-network/street-registry.json
            build/houston-road-network/street-registry-manifest.json
            build/houston-road-grid/roads-local-mm.json
            build/houston-road-grid/roads-local-mm-manifest.json
            build/houston-road-grid/road-centerline-cells.json
            build/houston-road-grid/road-centerline-cells-manifest.json
          if-no-files-found: error
          retention-days: 14
